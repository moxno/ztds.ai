name: Bug Report
description: Report a bug in ztds-mcp, ztds-audit, ztds (PyPI), ztds.ai, or RFC reference tooling using synthetic data only.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **ZERO-PII SAFETY NOTICE:** Never paste real PII, PHI, API secrets, private keys, or confidential company documents into GitHub issues. Use 100% synthetic test strings only.
  - type: dropdown
    id: component
    attributes:
      label: Affected ZTDS Component
      options:
        - ztds-mcp (npm / MCP stdio server)
        - ztds-audit (npm CLI linter)
        - ztds (PyPI Python reference package)
        - ztds.ai Website / Domain Scanner
        - RFC v1.0 Specification / Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version or URL
      description: Output of `npx ztds-mcp --version`, `npx ztds-audit --version`, `pip show ztds`, or the affected ztds.ai URL.
      placeholder: "e.g. ztds-mcp v1.2.2 or https://ztds.ai/mcp/"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Runtime & AI Client
      placeholder: "e.g. macOS 15, Node 22.x, Cursor IDE / Claude Desktop"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps & Synthetic Input
      description: Clear steps to reproduce using fake/synthetic test input only.
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true
  - type: checkboxes
    id: zero_pii_confirm
    attributes:
      label: Zero-PII & Non-Confidentiality Confirmation
      options:
        - label: I confirm this report contains ZERO real personal data, credentials, or confidential client records (100% synthetic data only).
          required: true
