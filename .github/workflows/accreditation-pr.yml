name: GitOps Accreditation PR Validator

on:
  pull_request:
    paths:
      - "data/**.json"
      - "badge/**.svg"
  workflow_dispatch:

concurrency:
  group: pr-accreditation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-submission:
    name: Validate Ecosystem Manifest & SHA-256 Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Registry, Companies, and Fellows Schemas
        run: |
          node test/registries-schema.test.js

      - name: Validate Codebase Conformance
        run: |
          node bin/ztds-audit.js --dir ./data
