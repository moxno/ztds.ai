name: IP Leak Prevention Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ip-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ip-guard:
    name: Scan for IP & Secret Leakage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Unified IP & Secret Leak Gate (SSOT)
        run: node scripts/ip-leak-gate.js --ci
