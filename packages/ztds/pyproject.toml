[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ztds"
version = "1.1.0"
description = "Zero-Trust Data Sanitization (ZTDS) - Canonical Python Reference Implementation (RFC v1.0, draft-sibiryakov-ztds-protocol)"
readme = "README.md"
authors = [
    { name = "Ilya Sibiryakov", email = "ilya@ztds.ai" },
    { name = "ZTDS AI Consortium", email = "standard@ztds.ai" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = [
    "ztds",
    "pii",
    "sanitizer",
    "zero-trust",
    "rfc",
    "ietf",
    "privacy",
    "redaction",
    "security",
    "litellm",
    "langchain",
    "crewai",
    "llamaindex"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://ztds.ai"
Documentation = "https://ztds.ai/standard/"
Specification = "https://datatracker.ietf.org/doc/draft-sibiryakov-ztds-protocol/"
Repository = "https://github.com/moxno/ztds.ai"
Issues = "https://github.com/moxno/ztds.ai/issues"

[project.scripts]
ztds = "ztds.cli:main"

[project.optional-dependencies]
litellm = ["litellm>=1.0.0"]
langchain = ["langchain-core>=0.1.0"]
crewai = ["crewai>=0.28.0"]
llamaindex = ["llama-index-core>=0.10.0"]
all = [
    "litellm>=1.0.0",
    "langchain-core>=0.1.0",
    "crewai>=0.28.0",
    "llama-index-core>=0.10.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ztds"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml"
]
