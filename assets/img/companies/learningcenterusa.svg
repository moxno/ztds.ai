<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-label="LearningCenterUsa.net — Acoustic Handset and 3-Bar PSTN Wave Crest">
  <defs>
    <linearGradient id="lcuBg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#091024" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lcuRing" x1="8" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="lcuHandset" x1="22" y1="26" x2="70" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lcuWave" x1="48" y1="20" x2="76" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Shield (Safe for Google 28x28 circular SERP mask) -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#lcuBg)" stroke="url(#lcuRing)" stroke-width="4" />

  <!-- Subtle Inner Acoustic Grid Ring -->
  <circle cx="48" cy="48" r="34" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- 3-Bar PSTN Narrowband (300Hz-3,400Hz) Equalizer Wave in Upper-Right Acoustic Cavity -->
  <rect x="50" y="29" width="5" height="14" rx="2.5" fill="url(#lcuWave)" />
  <rect x="58" y="21" width="5" height="22" rx="2.5" fill="#34d399" />
  <rect x="66" y="26" width="5" height="17" rx="2.5" fill="url(#lcuWave)" />

  <!-- Live Carrier Connection Beacon Dot -->
  <circle cx="74" cy="20" r="3.5" fill="#10b981" />

  <!-- Geometric US Telephone Handset Silhouette -->
  <path
    d="M27.5 26.5C29.3 24.7 32.2 24.7 34 26.5L40.2 32.7C41.8 34.3 41.9 36.8 40.5 38.6L37.4 42.5C36.7 43.4 36.6 44.7 37.3 45.7C40.4 50.4 44.6 54.6 49.3 57.7C50.3 58.4 51.6 58.3 52.5 57.6L56.4 54.5C58.2 53.1 60.7 53.2 62.3 54.8L68.5 61C70.3 62.8 70.3 65.7 68.5 67.5L64.8 71.2C61.2 74.8 55.6 76 50.8 73.9C38.6 68.6 26.4 56.4 21.1 44.2C19 39.4 20.2 33.8 23.8 30.2L27.5 26.5Z"
    fill="url(#lcuHandset)"
  />
</svg>
